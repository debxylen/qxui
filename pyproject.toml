[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qxui"
version = "1.0.0"
description = "An XML-based reactive-declarative native UI framework built on Qt."
readme = "README.md"

authors = [{ name = "Xylen" }]

license = "LGPL-3.0-only"
requires-python = ">=3.10"

keywords = ["qt", "qt5", "qt6", "xml", "qml", "pyside6", "gui", "ui"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = ["PySide6>=6.5.0"]

[project.urls]
Repository = "https://github.com/debxylen/qxui"
Issues = "https://github.com/debxylen/qxui/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["qxui*"]
